# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows installer on demand, without a version tag:
# Actions > "Build Windows installer" > Run workflow. The installer is
# attached to the run as an artifact; tick "Publish" to also put it on a
# pre-release (the apps' updaters skip pre-releases).
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        type: choice
        options: [x64, arm64]
        default: x64
      publish:
        description: "Also publish it as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows:
    name: Windows installer (${{ inputs.arch }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the ARM64 Rust target
        if: inputs.arch == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ inputs.arch == 'arm64' && 'win64_msvc2022_arm64_cross_compiled' || 'win64_msvc2022_64' }}
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: |
          if ("${{ inputs.arch }}" -eq "arm64") { ./scripts/package.ps1 -Arch arm64 }
          else { ./scripts/package.ps1 }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: noddy-windows-${{ inputs.arch }}
          path: target/package/*-setup.exe
          if-no-files-found: error

      # After the upload, so a failing check never costs you the installer.
      - name: Check it installs and uninstalls
        if: inputs.arch == 'x64'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1

      - name: Publish as a pre-release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          $files = Get-ChildItem target/package/*-setup.exe | ForEach-Object { $_.FullName }
          gh release create $tag @files `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --prerelease `
            --title "Windows build ${{ github.run_number }}" `
            --notes "Built from ${{ github.sha }} by the Build Windows installer workflow."
